name: 3x-ui Auto Nginx XHTTP and security validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Stack XHTTP and security
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate PR commit identities
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tests/ci_git_identity.py
      - name: Install test dependencies
        run: |
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          timeout 8m sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends nginx libnginx-mod-stream certbot sqlite3 openssl curl python3 python3-configobj python3-cryptography tar gzip shellcheck iproute2 qemu-user
      - name: All tracked shell scripts (syntax and ShellCheck errors)
        run: |
          mapfile -d '' -t scripts < <(git ls-files -z -- '*.sh')
          (( ${#scripts[@]} > 0 ))
          for script in "${scripts[@]}"; do
            printf 'bash -n %s\n' "$script"
            bash -n "$script"
          done
          shellcheck --version
          shellcheck --severity=error "${scripts[@]}"
      - name: Validate all workflows with actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          tool_dir=$(mktemp -d)
          trap 'rm -rf "$tool_dir"' EXIT
          curl -fLsS --retry 3 --connect-timeout 15 --max-time 120 \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o "$tool_dir/actionlint.tar.gz"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$tool_dir/actionlint.tar.gz" | sha256sum --check --status
          tar -xzf "$tool_dir/actionlint.tar.gz" -C "$tool_dir" actionlint
          mapfile -d '' -t workflows < <(git ls-files -z -- '.github/workflows/*.yml' '.github/workflows/*.yaml')
          (( ${#workflows[@]} > 0 ))
          "$tool_dir/actionlint" -version
          "$tool_dir/actionlint" "${workflows[@]}"
      - name: Test completeness
        run: python3 tests/run_ci.py --check-completeness
      - name: Transport and security regression tests
        env:
          NGINX_BIN: /usr/sbin/nginx
        run: python3 tests/run_ci.py --suite nonroot
      - name: Real Xray and subscription integration
        env:
          NGINX_BIN: /usr/sbin/nginx
        run: python3 tests/run_ci.py --suite integration
      - name: Whitespace validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check
          git show --format= --check HEAD
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" HEAD
          fi
