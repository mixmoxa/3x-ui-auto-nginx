name: Auto rerun

on:
  workflow_run:
    workflows:
      - Full fresh installer acceptance
      - 3x-ui Auto Nginx Backup and restore validation
      - 3x-ui Auto Nginx real service integration
      - 3x-ui Auto Nginx XHTTP and security validation
      - Upstream 3x-ui Canary
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: auto-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'timed_out'
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate completed run and retry failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # For workflow_run, GITHUB_SHA is the default-branch commit.
          # Load only that revision, never the triggering run's head or artifacts.
          script="$(mktemp)"
          trap 'rm -f "$script"' EXIT
          gh api -H 'Accept: application/vnd.github.raw+json' \
            "repos/$GITHUB_REPOSITORY/contents/tests/ci_auto_rerun.py?ref=$GITHUB_SHA" > "$script"
          python3 -I "$script"
